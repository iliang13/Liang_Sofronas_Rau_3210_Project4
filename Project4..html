<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.152.2/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";

      // Create custom card textures by drawing onto a canvas.
      // This keeps the card fronts and backs visually consistent in 2D and 3D.
      function makeTexture(drawfn) {
        const canvas = document.createElement("canvas");
        canvas.width = 256;
        canvas.height = 358;
        const ctx = canvas.getContext("2d");
        drawfn(ctx);

        const texture = new THREE.CanvasTexture(canvas);
        texture.mipmaps = false;
        texture.minFilter = THREE.LinearFilter;
        return texture;
      }

      // Back of the card design used for all cards in the deck.
      const cardBackTexture = makeTexture((ctx) => {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, 256, 358);
        ctx.fillStyle = "#174a7e";
        ctx.fillRect(12, 12, 232, 334);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 8;
        ctx.strokeRect(24, 24, 208, 310);
        ctx.lineWidth = 2;
        ctx.strokeRect(36, 36, 184, 286);
        ctx.beginPath();
        ctx.moveTo(36, 36);
        ctx.lineTo(220, 322);
        ctx.moveTo(220, 36);
        ctx.lineTo(36, 322);
        ctx.stroke();
      });

      // Shared materials for the card faces and borders.
      const backMaterial = new THREE.MeshStandardMaterial({
        map: cardBackTexture,
        roughness: 0.8,
        metalness: 0.1,
      });
      const edgeMaterial = new THREE.MeshStandardMaterial({
        color: "white",
        roughness: 0.7,
        metalness: 0.1,
      });

      // Creates the front face for a card based on its rank and suit.
      function frontTexture(value, suit) {
        const labels = { 11: "J", 12: "Q", 13: "K", 14: "A" };
        const symbols = { hearts: "♥", diamonds: "♦", clubs: "♣", spades: "♠" };
        const rank = labels[value] || value;
        const symbol = symbols[suit];
        const color =
          suit === "hearts" || suit === "diamonds" ? "#c62828" : "#111111";

        return makeTexture((ctx) => {
          ctx.fillStyle = "white";
          ctx.fillRect(0, 0, 256, 358);
          ctx.strokeStyle = "#222222";
          ctx.lineWidth = 4;
          ctx.strokeRect(8, 8, 240, 342);
          ctx.fillStyle = color;
          ctx.textAlign = "center";
          ctx.font = "bold 48px sans-serif";
          ctx.fillText(rank, 128, 142);
          ctx.font = "72px sans-serif";
          ctx.fillText(symbol, 128, 232);
        });
      }

      // A playing card is a thin box with a textured front and a textured back.
      class Card {
        constructor(value, suit) {
          this.value = value;
          this.suit = suit;
          this.frontTexture = frontTexture(value, suit);

          const frontMaterial = new THREE.MeshStandardMaterial({
            map: this.frontTexture,
            roughness: 0.8,
            metalness: 0.1,
          });

          const geometry = new THREE.BoxGeometry(1, 0.02, 1.4);

          this.mesh = new THREE.Mesh(geometry, [
            edgeMaterial,
            edgeMaterial,
            frontMaterial,
            backMaterial,
            edgeMaterial,
            edgeMaterial,
          ]);
          this.mesh.castShadow = true;
          this.mesh.receiveShadow = true;
        }

        // Rotate around the X-axis to flip the card between face up and face down.
        faceUp(faceUp) {
          this.mesh.rotation.x = faceUp ? 0 : Math.PI;
        }
      }

      // Build a standard 52-card deck.
      function createDeck() {
        const deck = [];
        for (const suit of ["hearts", "diamonds", "clubs", "spades"]) {
          for (let value = 2; value <= 14; value++) {
            deck.push(new Card(value, suit));
          }
        }
        return deck;
      }

      // 3D scene setup: lights, camera, renderer, ground, and skybox.
      const scene = new THREE.Scene();
      scene.background = null;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
      scene.add(ambientLight);

      const pointLight = new THREE.PointLight(0xffb266, 1.5, 25, 2);
      pointLight.position.set(0, 4, 5);
      pointLight.castShadow = true;
      pointLight.shadow.mapSize.set(1024, 1024);
      pointLight.shadow.bias = -0.0005;
      scene.add(pointLight);

      const sunLight = new THREE.DirectionalLight(0xfff3d6, 1.1);
      sunLight.position.set(-7, 8, 5);
      sunLight.target.position.set(0, 0, 0);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.set(2048, 2048);
      sunLight.shadow.camera.left = -10;
      sunLight.shadow.camera.right = 10;
      sunLight.shadow.camera.top = 10;
      sunLight.shadow.camera.bottom = -10;
      sunLight.shadow.camera.near = 0.5;
      sunLight.shadow.camera.far = 30;
      scene.add(sunLight);
      scene.add(sunLight.target);

      const camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        100,
      );
      camera.position.set(0, 10, 12);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const feltCanvas = document.createElement("canvas");
      feltCanvas.width = 512;
      feltCanvas.height = 512;
      const feltContext = feltCanvas.getContext("2d");
      feltContext.fillStyle = "#176b3f";
      feltContext.fillRect(0, 0, feltCanvas.width, feltCanvas.height);

      let textureSeed = 17;
      const randomTextureValue = () => {
        textureSeed = (textureSeed * 16807) % 2147483647;
        return (textureSeed - 1) / 2147483646;
      };

      for (let i = 0; i < 5000; i++) {
        const shade = randomTextureValue() > 0.5 ? "#277b4d" : "#105d36";
        feltContext.globalAlpha = 0.12 + randomTextureValue() * 0.18;
        feltContext.strokeStyle = shade;
        feltContext.lineWidth = 1;
        const x = randomTextureValue() * feltCanvas.width;
        const y = randomTextureValue() * feltCanvas.height;
        feltContext.beginPath();
        feltContext.moveTo(x, y);
        feltContext.lineTo(x + 1 + randomTextureValue() * 3, y + 1);
        feltContext.stroke();
      }
      feltContext.globalAlpha = 1;

      const feltTexture = new THREE.CanvasTexture(feltCanvas);
      feltTexture.colorSpace = THREE.SRGBColorSpace;
      feltTexture.wrapS = THREE.RepeatWrapping;
      feltTexture.wrapT = THREE.RepeatWrapping;
      feltTexture.repeat.set(10, 10);
      feltTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(20, 20),
        new THREE.MeshStandardMaterial({
          map: feltTexture,
          roughness: 0.95,
          metalness: 0,
        }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.02;
      ground.receiveShadow = true;
      scene.add(ground);

      const skyboxLoader = new THREE.CubeTextureLoader().setPath("skybox/");
      const skyboxTexture = skyboxLoader.load([
        "Daylight Box_Right.bmp",
        "Daylight Box_Left.bmp",
        "Daylight Box_Top.bmp",
        "Daylight Box_Bottom.bmp",
        "Daylight Box_Front.bmp",
        "Daylight Box_Back.bmp",
      ]);
      skyboxTexture.colorSpace = THREE.SRGBColorSpace;
      scene.background = skyboxTexture;

      // Keep the render aligned with the browser window size.
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Create the deck and place a few cards into the scene.
      const deck = createDeck();

      for (let i = 0; i < 3; i++) {
        deck[i].mesh.position.set((i - 1) * 2, 0, 2);
        scene.add(deck[i].mesh);
      }

      const player1 = [];
      const player2 = [];
      const player3 = [];

      deck.sort(() => Math.random() - 0.5);

      deck.forEach((card, index) => {
        if (index % 3 === 0) {
          player1.push(card);
        } else if (index % 3 === 1) {
          player2.push(card);
        } else {
          player3.push(card);
        }
      });

      const p1Position = new THREE.Vector3(-4, 0, 0);
      const p2Position = new THREE.Vector3(4, 0, 0);
      const p3Position = new THREE.Vector3(0, 0, -4);

      player1.forEach((card, i) => {
        card.faceUp(false);
        card.mesh.position.set(-5, i * 0.03, 0);
        scene.add(card.mesh);
      });

      player2.forEach((card, i) => {
        card.faceUp(false);
        card.mesh.position.set(5, i * 0.03, 0);
        scene.add(card.mesh);
      });

      player3.forEach((card, i) => {
        card.faceUp(false);
        card.mesh.position.set(0, i * 0.03, -5);
        scene.add(card.mesh);
      });

      deck.forEach((card) => {
        card.targetPosition = card.mesh.position.clone();
      });

      let currentPlayer = 0;
      let shadowsEnabled = true;
      window.addEventListener("keydown", (e) => {
        const key = e.key.toLowerCase();

        if (key === "l") {
          ambientLight.visible = !ambientLight.visible;
          return;
        }

        if (key === "p") {
          pointLight.visible = !pointLight.visible;
          return;
        }

        if (key === "t") {
          sunLight.visible = !sunLight.visible;
          return;
        }

        if (key === "m") {
          shadowsEnabled = !shadowsEnabled;
          renderer.shadowMap.enabled = shadowsEnabled;
          pointLight.castShadow = shadowsEnabled;
          sunLight.castShadow = shadowsEnabled;
          pointLight.shadow.needsUpdate = true;
          sunLight.shadow.needsUpdate = true;
          return;
        }

        if (key === "w") {
          pointLight.position.z -= 0.5;
          return;
        }

        if (key === "a") {
          pointLight.position.x -= 0.5;
          return;
        }

        if (key === "s") {
          pointLight.position.z += 0.5;
          return;
        }

        if (key === "d") {
          pointLight.position.x += 0.5;
          return;
        }

        if (key === "n") {
          if (
            player1.length === 0 ||
            player2.length === 0 ||
            player3.length === 0
          ) {
            console.log("Game Over");
            return;
          }

          const c1 = player1.shift();
          const c2 = player2.shift();
          const c3 = player3.shift();

          c1.faceUp(true);
          c2.faceUp(true);
          c3.faceUp(true);

          c1.targetPosition.set(-1.5, 1, 0);
          c2.targetPosition.set(0, 1, 0);
          c3.targetPosition.set(1.5, 1, 0);

          setTimeout(() => {
            let winnerDeck = player1;
            let highestCard = c1;

            if (c2.value > highestCard.value) {
              highestCard = c2;
              winnerDeck = player2;
            }

            if (c3.value > highestCard.value) {
              highestCard = c3;
              winnerDeck = player3;
            }

            console.log("Winner:", highestCard.value);

            c1.faceUp(false);
            c2.faceUp(false);
            c3.faceUp(false);

            winnerDeck.push(c1, c2, c3);

            if (winnerDeck === player1) {
              c1.targetPosition.set(-5, player1.length * 0.05, 0);
              c2.targetPosition.set(-5, (player1.length + 1) * 0.05, 0);
              c3.targetPosition.set(-5, (player1.length + 2) * 0.05, 0);
            }

            if (winnerDeck === player2) {
              c1.targetPosition.set(5, player2.length * 0.05, 0);
              c2.targetPosition.set(5, (player2.length + 1) * 0.05, 0);
              c3.targetPosition.set(5, (player2.length + 2) * 0.05, 0);
            }

            if (winnerDeck === player3) {
              c1.targetPosition.set(0, player3.length * 0.05, -5);
              c2.targetPosition.set(0, (player3.length + 1) * 0.05, -5);
              c3.targetPosition.set(0, (player3.length + 2) * 0.05, -5);
            }
          }, 1500);
        }
      });

      function animate() {
        requestAnimationFrame(animate);
        deck.forEach((card) => {
          card.mesh.position.lerp(card.targetPosition, 0.1);
        });
        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
